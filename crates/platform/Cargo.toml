[package]
name = "nexo-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Every OS-specific call in Nexo lives behind a trait in this crate. Windows implementations land in M2; Android swaps in later without touching callers (§12)."

[dependencies]
thiserror.workspace = true
zeroize.workspace = true

# Windows only, so the crate still compiles unchanged for Android (brief 12).
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }
